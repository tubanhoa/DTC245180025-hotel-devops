name: hotel

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

services:
  # ============================================================================
  # REVERSE PROXY NGINX (HTTPS, TLS 1.2/1.3, RATE LIMITING, SECURITY HEADERS)
  # CỔNG DUY NHẤT PUBLIC RA NGOÀI HOST (80 & 443)
  # ============================================================================
  nginx:
    image: nginx:1.27.1-alpine
    container_name: hotel-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
      - monitoring
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # CƠ SỞ DỮ LIỆU POSTGRESQL (CÔ LẬP MẠNG BACKEND, KHÔNG PUBLIC CỔNG, LEAST PRIVILEGE)
  # ============================================================================
  db:
    image: postgres:16.4-alpine3.20
    container_name: hotel-db
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-p0stgr3s_adm1n_s3cur3_2026!}
      POSTGRES_APP_USER: ${POSTGRES_USER:-hotel_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/init-users.sh:/docker-entrypoint-initdb.d/02-init-users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ============================================================================
  # ỨNG DỤNG WEB (NODE.JS EXPRESS, NON-ROOT USER NODE, NỐI FRONTEND VÀ BACKEND)
  # ============================================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: hotel-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    user: "node"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "true"
    volumes:
      - web_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q 'OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ============================================================================
  # QUẢN TRỊ CSDL PGADMIN 4 (SUBPATH /pgadmin/, NỐI FRONTEND VÀ BACKEND)
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:8.11
    container_name: hotel-pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # HỆ THỐNG GIÁM SÁT PROMETHEUS & GRAFANA (MẠNG MONITORING)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hotel-prometheus
    restart: unless-stopped
    networks:
      - monitoring
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hotel-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    networks:
      - frontend
      - monitoring
    user: "472:472"
    environment:
      GF_SERVER_ROOT_URL: https://192.168.186.130/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: hotel-cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - monitoring
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: hotel-nginx-exporter
    restart: unless-stopped
    networks:
      - frontend
      - monitoring
    user: "65534:65534"
    command:
      - -nginx.scrape-uri=http://nginx/nginx_status
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: hotel-postgres-exporter
    restart: unless-stopped
    networks:
      - backend
      - monitoring
    user: "65534:65534"
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${EXPORTER_PASSWORD}@db:5432/hotel?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 64M

  # ============================================================================
  # HỆ THỐNG LOG TẬP TRUNG LOKI, PROMTAIL & ALERT SINK
  # ============================================================================
  loki:
    image: grafana/loki:3.1.1
    container_name: hotel-loki
    restart: unless-stopped
    networks:
      - monitoring
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki_data:/loki
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  promtail:
    image: grafana/promtail:3.1.1
    container_name: hotel-promtail
    restart: unless-stopped
    networks:
      - monitoring
    command:
      - -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  alert-sink:
    build:
      context: ./alert-sink
      dockerfile: Dockerfile
    container_name: hotel-alert-sink
    restart: unless-stopped
    networks:
      - monitoring
    user: "node"
    volumes:
      - alert_logs:/var/log/alerts
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  db_data:
    name: hotel_db_data
  web_uploads:
    name: hotel_web_uploads
  pgadmin_data:
    name: hotel_pgadmin_data
  prometheus_data:
    name: hotel_prometheus_data
  grafana_data:
    name: hotel_grafana_data
  loki_data:
    name: hotel_loki_data
  alert_logs:
    name: hotel_alert_logs
