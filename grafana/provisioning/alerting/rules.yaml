apiVersion: 1

groups:
  - orgId: 1
    name: "Restaurant Security Alerts"
    folder: "Restaurant Monitoring"
    interval: 10s
    rules:
      - uid: brute-force-login-rule
        title: "Restaurant - Brute force login"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki
            model:
              editorMode: code
              expr: sum(count_over_time({job="webapp"} |= "LOGIN_FAILED" [1m]))
              instant: true
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: $B > 5
              refId: C
              type: math
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Phat hien tan cong do mat khau (Brute Force) vao trang dang nhap"
          description: "So luong LOGIN_FAILED vuot qua nguong 5 lan trong 1 phut. Can su dung LogQL kiem tra IP nguon va tai khoan bi nham toi."
        labels:
          severity: critical
